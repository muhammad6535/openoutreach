[supervisord]
nodaemon=true
user=root
logfile=/app/logs/supervisord.log
pidfile=/app/logs/supervisord.pid

[program:gunicorn]
command=gunicorn wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 120 --access-logfile - --error-logfile -
directory=/app
user=ubuntu
autostart=true
autorestart=true
startretries=3
stdout_logfile=/app/logs/gunicorn.log
stderr_logfile=/app/logs/gunicorn.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
environment=PYTHONUNBUFFERED="1",DJANGO_SETTINGS_MODULE="linkedin.django_settings"

[program:daemon]
command=python /app/railway/run_daemon.py
directory=/app
user=ubuntu
autostart=true
autorestart=unexpected
startretries=9999
exitcodes=0
stdout_logfile=/app/logs/daemon.log
stderr_logfile=/app/logs/daemon.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
environment=PYTHONUNBUFFERED="1",DJANGO_SETTINGS_MODULE="linkedin.django_settings"
