[supervisord]
nodaemon=true
user=root
logfile=/app/logs/supervisord.log
pidfile=/app/logs/supervisord.pid

[program:gunicorn]
command=gunicorn wsgi:application --bind 0.0.0.0:8000 --workers 1 --timeout 120 --access-logfile - --error-logfile -
directory=/app
user=ubuntu
autostart=true
autorestart=true
startretries=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1",DJANGO_SETTINGS_MODULE="linkedin.django_settings"

[program:daemon]
command=python /app/railway/run_daemon.py
directory=/app
user=ubuntu
autostart=true
autorestart=unexpected
startretries=9999
exitcodes=0
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1",DJANGO_SETTINGS_MODULE="linkedin.django_settings",DISPLAY=":99"
